version: '4.0'
# Generates cohorts for COVID outcome.
actions:
  generate_dataset_2019:
    run: >
      ehrql:v1 generate-dataset analysis/dataset_definition_covid.py 
      --output output/dataset_covid_2019.csv.gz
      --
      --start_date 2019-03-01
    outputs:
      highly_sensitive:
        population: output/dataset_covid_2019.csv.gz

