version: '5.0'
# Generates cohorts for COVID outcome.
actions:  
  generate_dataset_covid_2021:
      run: >
        ehrql:v1 generate-dataset analysis/dataset_definition_covid.py 
        --output output/dataset_covid_2021.arrow
        --
        --start_date 2021-03-01
      outputs:
        highly_sensitive:
          population: output/dataset_covid_2021.arrow

  generate_dataset_covid_2022:
      run: >
        ehrql:v1 generate-dataset analysis/dataset_definition_covid.py 
        --output output/dataset_covid_2022.arrow
        --test-data-file analysis/test_dataset_definition_covid.py
        --
        --start_date 2022-03-01
      outputs:
        highly_sensitive:
          population: output/dataset_covid_2022.arrow

  generate_dataset_covid_2023:
      run: >
        ehrql:v1 generate-dataset analysis/dataset_definition_covid.py 
        --output output/dataset_covid_2023.arrow
        --
        --start_date 2023-03-01
      outputs:
        highly_sensitive:
          population: output/dataset_covid_2023.arrow

  generate_dataset_covid_2024:
      run: >
        ehrql:v1 generate-dataset analysis/dataset_definition_covid.py 
        --output output/dataset_covid_2024.arrow
        --
        --start_date 2024-03-01
      outputs:
        highly_sensitive:
          population: output/dataset_covid_2024.arrow

  generate_dataset_flu_rsv_2018:
      run: >
        ehrql:v1 generate-dataset analysis/dataset_definition_flu_rsv.py 
        --output output/dataset_flu_rsv_2018.arrow
        --
        --start_date 2018-09-01
      outputs:
        highly_sensitive:
          population: output/dataset_flu_rsv_2018.arrow

  generate_dataset_flu_rsv_2019:
      run: >
        ehrql:v1 generate-dataset analysis/dataset_definition_flu_rsv.py 
        --output output/dataset_flu_rsv_2019.arrow
        --
        --start_date 2019-09-01
      outputs:
        highly_sensitive:
          population: output/dataset_flu_rsv_2019.arrow

  generate_dataset_flu_rsv_2021:
      run: >
        ehrql:v1 generate-dataset analysis/dataset_definition_flu_rsv.py 
        --output output/dataset_flu_rsv_2021.arrow
        --test-data-file analysis/test_dataset_definition_flu_rsv.py
        --
        --start_date 2021-09-01
      outputs:
        highly_sensitive:
          population: output/dataset_flu_rsv_2021.arrow

  generate_dataset_flu_rsv_2022:
      run: >
        ehrql:v1 generate-dataset analysis/dataset_definition_flu_rsv.py 
        --output output/dataset_flu_rsv_2022.arrow
        --
        --start_date 2022-09-01
      outputs:
        highly_sensitive:
          population: output/dataset_flu_rsv_2022.arrow

  generate_dataset_flu_rsv_2023:
      run: >
        ehrql:v1 generate-dataset analysis/dataset_definition_flu_rsv.py 
        --output output/dataset_flu_rsv_2023.arrow
        --
        --start_date 2023-09-01
      outputs:
        highly_sensitive:
          population: output/dataset_flu_rsv_2023.arrow

  generate_dataset_flu_rsv_2024:
      run: >
        ehrql:v1 generate-dataset analysis/dataset_definition_flu_rsv.py 
        --output output/dataset_flu_rsv_2024.arrow
        --
        --start_date 2024-09-01
      outputs:
        highly_sensitive:
          population: output/dataset_flu_rsv_2024.arrow

  measures_covid: 
      run: >
        ehrql:v1 generate-measures analysis/measures_covid.py
        --output output/measures/measures_covid.csv 
        --
        --start-date 2021-03-01
        --intervals 48
      outputs:
        moderately_sensitive:
          measures_csv: output/measures/measures_covid.csv

  measures_flu_2018: 
      run: >
        ehrql:v1 generate-measures analysis/measures_flu.py
        --output output/measures/measures_flu_2018.csv 
        --
        --start-date 2018-09-01
        --intervals 24
      outputs:
        moderately_sensitive:
          measures_csv: output/measures/measures_flu_2018.csv

  measures_flu_2021: 
      run: >
        ehrql:v1 generate-measures analysis/measures_flu.py
        --output output/measures/measures_flu_2021.csv 
        --
        --start-date 2021-09-01
        --intervals 48
      outputs:
        moderately_sensitive:
          measures_csv: output/measures/measures_flu_2021.csv

  measures_rsv_2018: 
      run: >
        ehrql:v1 generate-measures analysis/measures_rsv.py
        --output output/measures/measures_rsv_2018.csv 
        --
        --start-date 2018-09-01
        --intervals 24
      outputs:
        moderately_sensitive:
          measures_csv: output/measures/measures_rsv_2018.csv

  measures_rsv_2021: 
      run: >
        ehrql:v1 generate-measures analysis/measures_rsv.py
        --output output/measures/measures_rsv_2021.csv 
        --
        --start-date 2021-09-01
        --intervals 24
      outputs:
        moderately_sensitive:
          measures_csv: output/measures/measures_rsv_2021.csv

  measures_rsv_2023: 
      run: >
        ehrql:v1 generate-measures analysis/measures_rsv.py
        --output output/measures/measures_rsv_2023.csv 
        --
        --start-date 2023-09-01
        --intervals 24
      outputs:
        moderately_sensitive:
          measures_csv: output/measures/measures_rsv_2023.csv

  measures_rsv_age_2018: 
      run: >
        ehrql:v1 generate-measures analysis/measures_rsv_age.py
        --output output/measures/measures_rsv_age_2018.csv 
        --
        --start-date 2018-09-01
        --intervals 24
      outputs:
        moderately_sensitive:
          measures_csv: output/measures/measures_rsv_age_2018.csv

  measures_rsv_age_2021: 
      run: >
        ehrql:v1 generate-measures analysis/measures_rsv_age.py
        --output output/measures/measures_rsv_age_2021.csv 
        --
        --start-date 2021-09-01
        --intervals 24
      outputs:
        moderately_sensitive:
          measures_csv: output/measures/measures_rsv_age_2021.csv

  measures_rsv_age_2023: 
      run: >
        ehrql:v1 generate-measures analysis/measures_rsv_age.py
        --output output/measures/measures_rsv_age_2023.csv 
        --
        --start-date 2023-09-01
        --intervals 24
      outputs:
        moderately_sensitive:
          measures_csv: output/measures/measures_rsv_age_2023.csv

  data_process_bl:
      run: r:v2 analysis/data_processing_baseline.R 
      needs: 
      - generate_dataset_covid_2021
      - generate_dataset_covid_2022
      - generate_dataset_covid_2023
      - generate_dataset_covid_2024
      - generate_dataset_flu_rsv_2018
      - generate_dataset_flu_rsv_2019
      - generate_dataset_flu_rsv_2021
      - generate_dataset_flu_rsv_2022
      - generate_dataset_flu_rsv_2023
      - generate_dataset_flu_rsv_2024
      outputs: 
        highly_sensitive:
          data: output/an_bl_data_covid.arrow
          data_flu_rsv: output/an_bl_data_flu_rsv.arrow

  data_process_outcome_covid_2021:
      run: r:v2 analysis/data_processing_outcomes.R covid covid 2021 2025
      needs: 
      - generate_dataset_covid_2021
      - generate_dataset_covid_2022
      - generate_dataset_covid_2023
      - generate_dataset_covid_2024
      - data_process_bl
      outputs: 
        highly_sensitive:
          data_o_covid: output/an_outcome_data_covid_2021.rds
          data_f_covid: output/an_outcome_first_covid_2021.arrow

  data_process_outcome_flu_2018:
      run: r:v2 analysis/data_processing_outcomes.R flu flu_rsv 2018 2019
      needs: 
      - generate_dataset_flu_rsv_2018
      - generate_dataset_flu_rsv_2019
      - data_process_bl
      outputs: 
        highly_sensitive:
          data_o_covid: output/an_outcome_data_flu_2018.rds
          data_f_covid: output/an_outcome_first_flu_2018.arrow

  data_process_outcome_flu_2021:
      run: r:v2 analysis/data_processing_outcomes.R flu flu_rsv 2021 2025
      needs: 
      - generate_dataset_flu_rsv_2021
      - generate_dataset_flu_rsv_2022
      - generate_dataset_flu_rsv_2023
      - generate_dataset_flu_rsv_2024
      - data_process_bl
      outputs: 
        highly_sensitive:
          data_o_covid: output/an_outcome_data_flu_2021.rds
          data_f_covid: output/an_outcome_first_flu_2021.arrow

  data_process_outcome_rsv_2018:
      run: r:v2 analysis/data_processing_outcomes.R rsv flu_rsv 2018 2019
      needs: 
      - generate_dataset_flu_rsv_2018
      - generate_dataset_flu_rsv_2019
      - data_process_bl
      outputs: 
        highly_sensitive:
          data_o_covid: output/an_outcome_data_rsv_2018.rds
          data_f_covid: output/an_outcome_first_rsv_2018.arrow

  data_process_outcome_rsv_2021:
      run: r:v2 analysis/data_processing_outcomes.R rsv flu_rsv 2021 2025
      needs: 
      - generate_dataset_flu_rsv_2021
      - generate_dataset_flu_rsv_2022
      - generate_dataset_flu_rsv_2023
      - generate_dataset_flu_rsv_2024
      - data_process_bl
      outputs: 
        highly_sensitive:
          data_o_covid: output/an_outcome_data_rsv_2021.rds
          data_f_covid: output/an_outcome_first_rsv_2021.arrow

  tables:
      run: r:v2 analysis/1_1_tables.R 
      needs: 
        - data_process_bl
        - data_process_outcome_covid_2021
        - data_process_outcome_flu_2018
        - data_process_outcome_rsv_2018
        - data_process_outcome_flu_2021
        - data_process_outcome_rsv_2021
      outputs: 
        moderately_sensitive:
          table: output/tables/baseline_table_covid*.csv
          table_flu_rsv: output/tables/baseline_table_flu_rsv*.csv
          table_r: output/tables/baseline_table_covid_r.csv
          table_flu_rsv_r: output/tables/baseline_table_flu_rsv_r.csv
          table_out_c: output/tables/count_*.csv
        
  rates:
      run: r:v2 analysis/1_2_rates.R 
      needs: 
        - measures_covid
        - measures_flu_2018
        - measures_flu_2021
        - measures_rsv_2018
        - measures_rsv_2021
        - measures_rsv_2023
        - measures_rsv_age_2018
        - measures_rsv_age_2021
        - measures_rsv_age_2023
      outputs: 
        moderately_sensitive:
          rates_covid: output/tables/rounded_rates_*.csv

  cox_models_covid_2021:
      run: r:v2 analysis/1_3_cox_models.R covid_2021 
      needs: 
        - data_process_bl
        - data_process_outcome_covid_2021
      outputs:
        moderately_sensitive:
          table_cox: output/tables/cox_models_covid_2021.csv

  cox_models_flu_2018:
      run: r:v2 analysis/1_3_cox_models.R flu_2018 
      needs: 
        - data_process_bl
        - data_process_outcome_flu_2018
      outputs:
        moderately_sensitive:
          table_cox: output/tables/cox_models_flu_2018.csv

  cox_models_flu_2021:
      run: r:v2 analysis/1_3_cox_models.R flu_2021 
      needs: 
        - data_process_bl
        - data_process_outcome_flu_2021
      outputs:
        moderately_sensitive:
          table_cox: output/tables/cox_models_flu_2021.csv

  cox_models_rsv_2018:
      run: r:v2 analysis/1_3_cox_models.R rsv_2018 
      needs: 
        - data_process_bl
        - data_process_outcome_rsv_2018
      outputs:
        moderately_sensitive:
          table_cox: output/tables/cox_models_rsv_2018.csv

  cox_models_rsv_2021:
      run: r:v2 analysis/1_3_cox_models.R rsv_2021 
      needs: 
        - data_process_bl
        - data_process_outcome_rsv_2021
      outputs:
        moderately_sensitive:
          table_cox: output/tables/cox_models_rsv_2021.csv

  cox_models_strat_covid_2021:
      run: r:v2 analysis/1_4_cox_models_stratified.R covid_2021
      needs: 
        - data_process_bl
        - data_process_outcome_covid_2021
      outputs:
        moderately_sensitive:
          table_cox_s: output/tables/cox_models_stratified_covid_2021.csv

  cox_models_strat_flu_2018:
      run: r:v2 analysis/1_4_cox_models_stratified.R flu_2018
      needs: 
        - data_process_bl
        - data_process_outcome_flu_2018
      outputs:
        moderately_sensitive:
          table_cox_s: output/tables/cox_models_stratified_flu_2018.csv

  cox_models_strat_flu_2021:
      run: r:v2 analysis/1_4_cox_models_stratified.R flu_2021
      needs: 
        - data_process_bl
        - data_process_outcome_flu_2021
      outputs:
        moderately_sensitive:
          table_cox_s: output/tables/cox_models_stratified_flu_2021.csv

  cox_models_strat_rsv_2018:
      run: r:v2 analysis/1_4_cox_models_stratified.R rsv_2018
      needs: 
        - data_process_bl
        - data_process_outcome_rsv_2018
      outputs:
        moderately_sensitive:
          table_cox_s: output/tables/cox_models_stratified_rsv_2018.csv

  cox_models_strat_rsv_2021:
      run: r:v2 analysis/1_4_cox_models_stratified.R rsv_2021
      needs: 
        - data_process_bl
        - data_process_outcome_rsv_2021
      outputs:
        moderately_sensitive:
          table_cox_s: output/tables/cox_models_stratified_rsv_2021.csv

  km_plots:
      run: r:v2 analysis/1_5_km_plots.R
      needs: 
        - data_process_bl
        - data_process_outcome_covid_2021
        - data_process_outcome_flu_2018
        - data_process_outcome_rsv_2018
        - data_process_outcome_flu_2021
        - data_process_outcome_rsv_2021
      outputs:
        moderately_sensitive:
          plots: output/tables/plot_*.svg