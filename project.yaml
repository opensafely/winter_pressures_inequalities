version: '4.0'
# To use the same code to generate a study cohort each year that can be used for each disease.
actions:
  generate_dataset_2020:
    run: >
      ehrql:v1 generate-dataset analysis/dataset_definition_covid.py 
      --test-data-file analysis/test_dataset_definition_covid.py
      --output output/dataset_covid_2020.csv.gz
      --
      --start_date 2020-03-01
    outputs:
      highly_sensitive:
        population: output/dataset_covid_2020.csv.gz

  generate_dataset_2019:
    run: >
      ehrql:v1 generate-dataset analysis/dataset_definition_covid.py 
      --test-data-file analysis/test_dataset_definition_covid.py
      --output output/dataset_covid_2019.csv.gz
      --
      --start_date 2019-03-01
    outputs:
      highly_sensitive:
        population: output/dataset_covid_2019.csv.gz
